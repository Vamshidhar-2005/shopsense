version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopsense_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:///./shopsense.db
      - ENVIRONMENT=production
      - SECRET_KEY=shopsense_super_secret_jwt_key_2026
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/admin/metrics')"]
      interval: 30s
      timeout: 5s
      retries: 3
